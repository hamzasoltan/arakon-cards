<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حدث البطاقات — مجلس الأراكون</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070b;--p:#12121b;--p2:#1a1a26;--g:#e2b44f;--g2:#f6dc93;--s:#c9ccd6;--t:#ecebf2;--m:#8d8fa3;--ln:#2a2a3a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 50% -100px,#2a1a0a55,transparent),var(--bg);color:var(--t);font-family:Cairo,Tahoma,sans-serif;line-height:1.7}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0a0a10ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);display:flex;gap:4px;overflow-x:auto;padding:6px 10px;align-items:center}
nav img{height:34px}nav a{color:var(--s);text-decoration:none;padding:6px 12px;border-radius:8px;white-space:nowrap;font-size:14px}
nav a.on{background:linear-gradient(135deg,var(--g),#a8741a);color:#1a1100;font-weight:800}
main{max-width:1100px;margin:auto;padding:16px}h2{color:var(--g2);margin:22px 0 10px}
.hero{text-align:center;padding:20px 0}.hero img{max-width:min(420px,80%)}.hero p{color:var(--s);max-width:640px;margin:8px auto}
.btn{background:linear-gradient(135deg,var(--g),#a8741a);color:#1a1100;border:0;border-radius:10px;padding:9px 18px;font:800 14px Cairo,sans-serif;cursor:pointer;margin:4px;text-decoration:none;display:inline-block}
.btn.o{background:transparent;color:var(--g2);border:1px solid var(--g)}.btn.d{background:#7a1f1f;color:#fff}.btn.s{padding:4px 10px;font-size:12px}
.box{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{--c:var(--g);position:relative;aspect-ratio:2/3;border-radius:12px;padding:3px;background:linear-gradient(160deg,var(--c),#222 60%,var(--c));cursor:pointer;transition:.25s}
.card:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 8px 28px -6px var(--c)}
.card .in{height:100%;border-radius:10px;background:var(--p2) center/cover;display:flex;flex-direction:column;justify-content:space-between;padding:8px;overflow:hidden;position:relative}
.card .in:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#000d)}
.card .in>*{position:relative}.card .n{font-size:11px;color:var(--g2)}.card b{font-size:13px;line-height:1.3}.card small{color:var(--s);font-size:10px}
.card.lock .in{filter:grayscale(1) brightness(.55)}.card.lock:after{content:"🔒";position:absolute;top:40%;left:42%;font-size:26px}
.card.rare{animation:gl 2.6s infinite alternate}.card.special{animation:gl 1.6s infinite alternate;background:linear-gradient(160deg,#fff,var(--c),#fff)}
@keyframes gl{to{box-shadow:0 0 22px var(--c)}}
.tag{font-size:10px;padding:1px 7px;border-radius:9px;background:#0008;border:1px solid var(--c)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stats div{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center}.stats b{display:block;font-size:24px;color:var(--g2)}
.bar{height:8px;background:#222;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#a8741a,var(--g2))}
.pod{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:14px 0}.pod div{flex:1;max-width:200px;text-align:center;background:var(--p);border:1px solid var(--g);border-radius:12px;padding:10px;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px solid var(--ln);cursor:pointer}.row .r{width:30px;color:var(--g2);font-weight:800}.row .f{flex:1}
input,select,textarea{background:#0c0c14;color:var(--t);border:1px solid var(--ln);border-radius:8px;padding:8px;font:14px Cairo,sans-serif;width:100%}
.bar2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.bar2>*{flex:1;min-width:120px;width:auto}
.mod{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}.mod>div{background:var(--p);border:1px solid var(--g);border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.mod label{display:block;margin:8px 0 2px;color:var(--s);font-size:13px}.mod img.big{width:100%;border-radius:10px;max-height:46vh;object-fit:contain}
#toast{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g);color:#1a1100;padding:8px 18px;border-radius:20px;z-index:30;font-weight:800}
.tabs{display:flex;gap:6px;overflow-x:auto}.mut{color:var(--m);font-size:13px}.fl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
</style></head><body>
<nav id="nav"></nav><main id="app"><p class="mut">جارٍ التحميل…</p></main><footer style="text-align:center;color:var(--m);font-size:13px;padding:18px 12px 28px;border-top:1px solid var(--ln);margin-top:24px">جميع حقوق تصميم الموقع عائدة إلى زورا</footer><div id="toast" hidden></div>

const D={intro:'حدث تنافسي ملكي بين خمسة فيالق؛ اجمع بطاقاتك النادرة وتصدّر القائمة.',txt:"## هوية البطاقات\nتختلف الشخصيات بحسب تخصص كل فيلق، بحيث تعبّر البطاقات عن هويته ومجاله، ومن أمثلة ذلك:\n🎴 فيلق المانجا: شخصيات الأنمي والمانجا.\n🎴 فيلق الرياضة: نجوم الرياضة واللاعبون.\n🎴 فيلق المواهب: المبدعون والفنانون، مثل دافنشي وفان غوخ.\n🎴 فيلق السينما: نجوم السينما والشخصيات المرتبطة بالأفلام.\n🎴 فيلق الألعاب: شخصيات وأبطال عالم الألعاب.\n## نظام البطاقات\nيتكون كل فيلق من 5 بطاقات مختلفة، تمثّل شخصيات مرتبطة بهوية الفيلق وتخصصه، ويكون لكل بطاقة طريقة محددة للحصول عليها.\n❶ بطاقة الأسئلة ❓ للحصول عليها يجب الإجابة عن 30 سؤالاً وفق آلية الأسئلة المعتمدة في الفيلق.\n❷ بطاقة الفعاليات 🎯 يحصل عليها العضو الذي يحقق المركز الأول في ثلاث فعاليات.\n❸ بطاقة النقاشات 💬 يحصل عليها العضو الذي يحقق المركز الأول في ثلاث نقاشات.\n❹ بطاقة ملك التفاعل ⚡ يحصل عليها العضو الذي يحقق لقب ملك التفاعل لمدة ثلاثة أيام.\n❺ البطاقة الخاصة 🔮 مختلفة عن بقية البطاقات، إذ تخصص لها مهمات خاصة تُعلن في وقتها، وعلى الأعضاء تنفيذها للحصول عليها.\n## مكافأة البطاقات\nكلما حصلت على بطاقة من خلال إنجاز التحدي الخاص بها، تحصل على 10 كوينز 🪙 إضافية تضاف إلى رصيدك. ويمكنك الاستفادة منها لاحقاً في شراء البطاقات أو الاستفادة من نظام البيع والتبادل.\n## شراء بطاقة\nإذا كانت هناك بطاقة تنقصك لإكمال مجموعتك يمكنك شراؤها مقابل:\nسعر البطاقة الواحدة: 50 كوينز 🪙\nويُستثنى من ذلك البطاقة الخاصة، إذ لا يمكن شراؤها بالسعر المعتاد وتخضع لنظامها ومميزاتها الخاصة.\n## تكرار البطاقة\nإذا حصلت على أكثر من نسخة من البطاقة نفسها، يمكنك بيع البطاقة المكررة لأحد الأعضاء مقابل كوينز أو بطاقة للاستفادة منها في شراء البطاقات التي تحتاج إليها.\n## تبادل البطاقات 🎴\nيمكنك مبادلة إحدى بطاقاتك ببطاقة أخرى تحتاج إليها حتى لو كانت من فيلق مختلف، وتتم العملية وفق الخطوات التالية:\n١. يتفق العضوان على البطاقات التي يرغب كل منهما في مبادلتها.\n٢. يتواصل كل عضو مع قائد الفيلق التابع له.\n٣. يراجع القادة عملية التبادل ويوافقون عليها قبل اعتمادها.\n٤. بعد الموافقة يُعلن التبادل ويُحدَّث سجل البطاقات لدى الطرفين.",tie:'none',reward:10};

async function initLocalData(){
 const existing=JSON.parse(localStorage.getItem('arakon:legions')||'{}');if(Object.keys(existing).length)return;
 // Seed this browser from the public JSON data file when available.
 try{
  const response=await fetch('./data.json',{cache:'no-store'});
  if(response.ok){const d=await response.json();let loaded=false;
   for(const n of ['legions','cards','members','tasks','market','admins','logs'])if(Array.isArray(d[n])){const obj={};for(const x of d[n])if(x&&x.id){const{id,...rest}=x;obj[id]=rest}localStorage.setItem('arakon:'+n,JSON.stringify(obj));loaded=true}
   if(d.settings)localStorage.setItem('arakon:settings',JSON.stringify({main:d.settings}));
   if(loaded&&Object.keys(JSON.parse(localStorage.getItem('arakon:legions')||'{}')).length)return;
  }
 }catch(e){console.warn('تعذر تحميل data.json؛ سيتم استخدام البيانات الافتراضية.',e)}

 localStorage.setItem('arakon:legions',JSON.stringify(legs));localStorage.setItem('arakon:cards',JSON.stringify(cards));localStorage.setItem('arakon:settings',JSON.stringify({main:D}));
